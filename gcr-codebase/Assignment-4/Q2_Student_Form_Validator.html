<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Form Validator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 35px auto; padding: 0 16px; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input { display: block; box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; border: 2px solid #aaa; border-radius: 5px; }
    input.valid { border-color: #198754; }
    input.invalid { border-color: #dc3545; }
    .error { color: #dc3545; min-height: 18px; font-size: 0.9rem; }
    button { margin-top: 18px; padding: 10px 16px; cursor: pointer; }
    #result { margin-top: 15px; }
  </style>
</head>
<body>
  <h1>Student Registration</h1>
  <form id="studentForm" novalidate>
    <label for="name">Name</label>
    <input id="name" name="name" autocomplete="name">
    <div class="error" id="nameError"></div>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email">
    <div class="error" id="emailError"></div>

    <label for="phone">Phone (10 digits)</label>
    <input id="phone" name="phone" inputmode="numeric" maxlength="10">
    <div class="error" id="phoneError"></div>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password">
    <div class="error" id="passwordError"></div>

    <button type="submit">Register</button>
    <p id="result" role="status"></p>
  </form>
  <script src="Q2_Student_Form_Validator.js"></script>
</body>
</html>
