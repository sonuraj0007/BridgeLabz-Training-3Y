<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pricing Plans</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="pricing.css"></head>
<body><header class="text-center py-5"><h1>Choose Your Plan</h1><p class="lead">Simple pricing for growing teams.</p></header>
<main class="container pb-5"><section class="row g-4">
<div class="col-md-4"><article class="card plan h-100 shadow-sm"><div class="card-body text-center"><h2>Basic</h2><h3>₹499/mo</h3><ul class="list-unstyled text-start my-4"><li>✓ 5 Projects</li><li>✓ 5 GB Storage</li><li>✓ Email Support</li></ul><button class="btn btn-outline-primary">Choose Basic</button></div></article></div>
<div class="col-md-4"><article class="card plan h-100 bg-primary text-white shadow-lg"><div class="card-body text-center"><h2>Pro</h2><h3>₹999/mo</h3><ul class="list-unstyled text-start my-4"><li>✓ 20 Projects</li><li>✓ 50 GB Storage</li><li>✓ Priority Support</li></ul><button class="btn btn-light">Choose Pro</button></div></article></div>
<div class="col-md-4"><article class="card plan h-100 shadow-sm"><div class="card-body text-center"><h2>Enterprise</h2><h3>₹1,999/mo</h3><ul class="list-unstyled text-start my-4"><li>✓ Unlimited Projects</li><li>✓ 200 GB Storage</li><li>✓ Dedicated Support</li></ul><button class="btn btn-outline-primary">Choose Enterprise</button></div></article></div>
</section></main></body></html>
