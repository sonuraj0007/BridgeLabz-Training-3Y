<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Notifications Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="notifications.css"></head>
<body><header class="bg-dark text-white py-4"><div class="container"><h1>Notifications Dashboard</h1></div></header>
<main class="container py-5"><section class="card shadow-sm"><div class="card-body"><h2 class="h4">Recent Notifications</h2>
<div class="alert alert-success">New message received from your project team.</div><div class="alert alert-info">Tip: Enable two-factor authentication.</div><div class="alert alert-danger">Warning: Your password will expire soon.</div>
<div class="alert alert-warning alert-dismissible fade show">Your profile is incomplete.<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
</div></section><section class="bg-light border rounded p-4 mt-4"><h2 class="h5">Summary</h2><p>4 notifications need your attention.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
