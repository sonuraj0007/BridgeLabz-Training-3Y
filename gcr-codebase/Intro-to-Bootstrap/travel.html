<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Travel Agency Showcase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="travel.css"></head>
<body><header class="bg-dark text-white text-center py-4"><h1>WanderWorld Travel</h1><p class="mb-0">Explore more. Travel better.</p></header>
<main><section class="container py-5"><div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
<div class="carousel-inner rounded shadow">
<div class="carousel-item active" data-bs-interval="3000"><img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1400&q=80" class="d-block w-100" alt="Paris"><div class="carousel-caption"><h2>Paris</h2><p>Experience the city of lights.</p></div></div>
<div class="carousel-item" data-bs-interval="4000"><img src="https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=1400&q=80" class="d-block w-100" alt="Tokyo"><div class="carousel-caption"><h2>Tokyo</h2><p>Discover tradition and technology.</p></div></div>
<div class="carousel-item" data-bs-interval="5000"><img src="https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=1400&q=80" class="d-block w-100" alt="Santorini"><div class="carousel-caption"><h2>Santorini</h2><p>Relax beside the Aegean Sea.</p></div></div>
</div><button class="carousel-control-prev" data-bs-target="#travelCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button><button class="carousel-control-next" data-bs-target="#travelCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button></div>
<div class="mt-5"><h2>Booking Completion</h2><div class="progress"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%">70%</div></div></div></section></main>
<footer class="bg-dark text-white text-center py-4">Contact: travel@wanderworld.example | +91 98765 43210</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
