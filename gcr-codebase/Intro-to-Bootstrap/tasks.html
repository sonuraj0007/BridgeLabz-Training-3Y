<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="tasks.css"></head>
<body><header class="bg-primary text-white py-4"><div class="container d-flex justify-content-between"><h1 class="h2">Task Tracker</h1><span class="badge bg-light text-primary fs-6">Pending: 4</span></div></header>
<main class="container py-5"><h2>My Tasks</h2><div class="list-group shadow-sm">
<div class="list-group-item d-flex justify-content-between">Finish cloud assignment <span class="badge bg-danger rounded-pill">High</span></div>
<div class="list-group-item d-flex justify-content-between">Practice Java arrays <span class="badge bg-warning text-dark rounded-pill">Medium</span></div>
<div class="list-group-item d-flex justify-content-between">Read Bootstrap docs <span class="badge bg-success rounded-pill">Low</span></div>
<div class="list-group-item d-flex justify-content-between">Push project to GitHub <span class="badge bg-danger rounded-pill">High</span></div></div>
<button class="btn btn-success mt-4">Completed <span class="badge bg-light text-success">2</span></button></main></body></html>
